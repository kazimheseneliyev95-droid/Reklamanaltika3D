services:
  - type: web
    name: whatsapp-crm
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_WEBHOOK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOW_LEGACY_MASTER_PASSWORD
        value: "true"
      - key: ALLOW_LEGACY_TOKEN
        value: "true"
      # Meta (Facebook/Instagram) OAuth + webhooks — set values in the Render dashboard.
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        value: https://whatsapp-crm-dndk.onrender.com
      - key: FB_API_VERSION
        value: v21.0
